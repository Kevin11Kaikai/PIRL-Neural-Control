# Default configuration for PIRL experiments

# Environment settings
env:
  name: "WilsonCowan"
  dt: 0.01              # Time step for simulation
  max_steps: 1000       # Maximum steps per episode

  # Wilson-Cowan specific parameters
  tau_e: 1.0           # Time constant for excitatory population
  tau_i: 1.0           # Time constant for inhibitory population
  w_ee: 12.0           # E->E connection weight
  w_ei: 4.0            # I->E connection weight
  w_ie: 13.0           # E->I connection weight
  w_ii: 11.0           # I->I connection weight

  # Reward function parameters
  target_state: [0.5, 0.3]  # Target E, I values
  reward_type: "quadratic"   # Reward function type

# Model settings
model:
  pinn:
    hidden_dims: [64, 64, 32]
    activation: "tanh"
    learning_rate: 0.001
    physics_weight: 1.0      # Weight for physics loss term

  policy:
    hidden_dims: [128, 128, 64]
    activation: "relu"
    learning_rate: 0.0003

# Agent settings
agent:
  algorithm: "PPO"
  gamma: 0.99              # Discount factor
  gae_lambda: 0.95         # GAE parameter
  clip_epsilon: 0.2        # PPO clip parameter
  value_loss_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 0.5

  # Training settings
  n_steps: 2048            # Steps per update
  batch_size: 64
  n_epochs: 10             # Optimization epochs per update

# Training settings
training:
  total_timesteps: 1000000
  eval_frequency: 10000    # Evaluate every N steps
  save_frequency: 50000    # Save model every N steps
  n_eval_episodes: 10
  seed: 42

  # Logging
  log_dir: "logs"
  use_wandb: false
  wandb_project: "PIRL"
  wandb_entity: null

# Evaluation settings
evaluation:
  n_episodes: 100
  render: false
  save_trajectories: true
